expression_engine: cel-v1
routines:
  inspect_artifact:
    inputs:
      path:
        type: string
        value: ${{ with.path }}
    actions:
    - type: inspect_file
      target: ${{ inputs.path }}
      save_to: file_info
    outputs:
      value:
        type: object
        value: ${{ actions.file_info }}
  record_artifact:
    inputs:
      path:
        type: string
        value: ${{ with.path }}
      logs:
        type: array
        value: "${{ has(with.logs) ? with.logs : [] }}"
        default: []
    actions:
    - type: execute_routine
      routine: inspect_artifact
      save_to: inspected
      with:
        path: ${{ inputs.path }}
    - type: write_json
      path: ${{ session.output_dir }}/manifest.json
      content:
        ${{ node.name }}:
          file: ${{ actions.inspected.outputs.value }}
          logs: ${{ inputs.logs }}
    outputs:
      value:
        type: object
        value: ${{ actions.inspected.outputs.value }}
pipeline:
  demo:
    inputs: {}
    nodes:
    - name: artifact-demo
      run:
      - type: write_json
        path: ${{ session.output_dir }}/result.json
        content:
          message: hello
      - type: execute_routine
        routine: record_artifact
        save_to: artifact
        with:
          path: ${{ session.output_dir }}/result.json
          logs:
          - File inspected
      postcondition:
        operator: action_state
        target:
        - artifact
        - success
        expected: true
