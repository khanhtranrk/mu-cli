name: Release Mu CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux x64
        run: |
          mkdir -p dist
          bun build --compile \
            --target=bun-linux-x64 \
            ./src/index.ts \
            --outfile dist/mu-cli-linux-x64

      - name: Smoke test compiled workload preparation
        run: |
          chmod +x dist/mu-cli-linux-x64
          bun scripts/smoke-compiled.ts ./dist/mu-cli-linux-x64

      - name: Generate checksum
        run: |
          cd dist
          sha256sum mu-cli-linux-x64 > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mu-cli-linux-x64 \
            dist/SHA256SUMS \
            --title "Mu CLI ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
