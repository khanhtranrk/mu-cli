expression_engine: cel-v1
events:
  - on: pipeline_started
    do:
      - type: report_node
        request_status: processing
        request_events: [{level: info, message: Request started}]
  - on: node_started
    do:
      - type: report_node
        status: running
  - on: node_finished
    do:
      - type: report_node
        status: '${{ node.status == "success" ? "succeeded" : "failed" }}'
        events: [{level: info, message: Node finished}]
  - on: pipeline_finished
    do:
      - type: report_node
        request_status: '${{ event.pipeline.status == "success" ? "succeeded" : "process_failed" }}'
workloads:
  generate:
    units: 0
    params:
      path: {type: string}
      message: {type: string}
      request_id: {type: string}
    target: bun
    args:
      - -e
      - 'await Bun.write(process.argv[1], JSON.stringify({message: process.argv[2], requestId: process.argv[3]}) + "\n");'
      - '${{ params.path }}'
      - '${{ params.message }}'
      - '${{ params.request_id }}'
pipeline:
  demo:
    params:
      message: {type: string, default: Hello from MU CLI v2}
    nodes:
      - name: publish
        context:
          result_path: '${{ session.output_dir }}/requests/${{ request.requestId }}/result.json'
        before_run:
          - type: create_dir
            path: '${{ session.output_dir }}/requests/${{ request.requestId }}'
        run:
          - type: execute_workload
            workload: generate
            args:
              path: '${{ result_path }}'
              message: '${{ params.message }}'
              request_id: '${{ request.requestId }}'
        after_run:
          - type: upload_artifact
            artifact_id: result
            content_type: application/json
            target: '${{ result_path }}'
            label: CPU smoke output
            save_state: published
        postcondition:
          operator: file_exists
          path: '${{ result_path }}'
      - name: verify
        depends_on: [publish]
        run:
          - type: download_artifact
            artifact_id: result
            target: '${{ session.output_dir }}/requests/${{ request.requestId }}/downloaded.json'
        postcondition:
          operator: file_exists
          path: '${{ session.output_dir }}/requests/${{ request.requestId }}/downloaded.json'
