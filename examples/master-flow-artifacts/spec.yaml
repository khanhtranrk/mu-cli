# Store in MasterFlow, create a disposable demo request, then run:
# uv run mu master-flow run <spec-slug> --unit-id artifact-demo
# Configure MU_MASTER_FLOW_SERVER and MU_MASTER_FLOW_TOKEN outside the spec.
# CPU-only; creates a tiny file and performs real uploads/downloads.
entries:
  master_flow:
    initialization: []
    finalization: []
pipeline:
  demo:
    params: {}
    nodes:
      - name: artifact-demo
        context:
          artifact_path: "{session[output_dir]}/{request[requestId]}/result.json"
          downloaded_path: "{session[output_dir]}/{request[requestId]}/downloaded.json"
        before_run:
          - type: write_json
            path: "{artifact_path}"
            content:
              message: Hello from Mu
              requestId: "{request[requestId]}"
          - type: execute_command
            target: python
            args:
              - -c
              - "import hashlib, sys; print(hashlib.file_digest(open(sys.argv[1], 'rb'), 'sha256').hexdigest(), end='')"
              - "{artifact_path}"
            save_state: file_hash
          - type: execute_command
            target: python
            args:
              - -c
              - "import os, sys; print(os.path.getsize(sys.argv[1]), end='')"
              - "{artifact_path}"
            save_state: file_size
          - type: send_http_request
            url: "{session[server]}/api/requests/artifacts/upload-url"
            method: post
            header:
              Authorization: "Bearer {session[token]}"
              Content-Type: application/json
            body:
              requestId: "{request[requestId]}"
              artifactId: demo-output
              sha256: "{actions[file_hash][stdout]}"
              size: "{actions[file_size][stdout]}"
            save_state: upload
          - type: send_http_request
            url: "{actions[upload][body][uploadUrl]}"
            method: post
            header:
              Content-Type: application/json
            body_file: "{artifact_path}"
            timeout: 120
            save_state: stored
          - type: send_http_request
            url: "{session[server]}/api/requests/artifacts/complete"
            method: post
            header:
              Authorization: "Bearer {session[token]}"
              Content-Type: application/json
            body:
              requestId: "{request[requestId]}"
              uploadId: "{actions[upload][body][uploadId]}"
              storageId: "{actions[stored][body][storageId]}"
              name: result.json
              nodeName: artifact-demo
              label: Demo output
            save_state: registered
          - type: send_http_request
            url: "{session[server]}/api/requests/artifacts/download?requestId={request[requestId]}&artifactId=demo-output"
            header:
              Authorization: "Bearer {session[token]}"
            response_file: "{downloaded_path}"
            timeout: 120
            save_state: downloaded
          - type: execute_command
            target: python
            args:
              - -c
              - "from pathlib import Path; import sys; assert Path(sys.argv[1]).read_bytes() == Path(sys.argv[2]).read_bytes()"
              - "{artifact_path}"
              - "{downloaded_path}"
