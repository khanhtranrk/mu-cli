# Scheduler smoke with reusable routines; no artifact download.
# Node reports below preserve this demo's explicit reporting. Mu also reports lifecycle automatically.
# start reports processing; complete reports succeeded only after its postcondition and final node reports.
entries:
  master_flow:
    initialization:
    - type: execute_routine
      routine: send_notification
      args:
        title: Scheduler smoke started
        message: Worker initialized for scheduler-smoke.
      ignore_error: true
    finalization:
    - type: execute_routine
      routine: send_notification
      args:
        title: Scheduler smoke ended
        message: Worker finished with status {entry[status]}.
      ignore_error: true
routines:
  send_notification:
    params:
      title:
        type: string
      message:
        type: string
      tags:
        type: array
        default: []
    actions:
    - type: send_http_request
      url: '{session[server]}/api/notifications/send'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        title: '{params[title]}'
        message: '{params[message]}'
        tags: '{params[tags]}'
  report_node_status:
    params:
      status:
        type: string
      logs:
        type: array
        default: []
    actions:
    - type: send_http_request
      url: '{session[server]}/api/requests/report'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        id: '{request[requestId]}'
        node_states:
          '{node[name]}':
            status: '{params[status]}'
            logs: '{params[logs]}'
  report_request_status:
    params:
      status:
        type: string
    actions:
    - type: send_http_request
      url: '{session[server]}/api/requests/report'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        id: '{request[requestId]}'
        status: '{params[status]}'
  upload_artifact:
    params:
      artifact_path:
        type: string
      artifact_id:
        type: string
      node_name:
        type: string
      label:
        type: string
        default: Artifact
      content_type:
        type: string
        default: application/octet-stream
    actions:
    - type: inspect_file
      target: '{params[artifact_path]}'
      save_state: file_info
    - type: send_http_request
      url: '{session[server]}/api/requests/artifacts/upload-url'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        requestId: '{request[requestId]}'
        artifactId: '{params[artifact_id]}'
        sha256: '{actions[file_info][sha256]}'
        size: '{actions[file_info][size]}'
      save_state: upload
    - type: send_http_request
      url: '{actions[upload][body][uploadUrl]}'
      method: post
      header:
        Content-Type: '{params[content_type]}'
      body_file: '{actions[file_info][path]}'
      timeout: 120
      save_state: stored
    - type: send_http_request
      url: '{session[server]}/api/requests/artifacts/complete'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        requestId: '{request[requestId]}'
        uploadId: '{actions[upload][body][uploadId]}'
        storageId: '{actions[stored][body][storageId]}'
        name: '{actions[file_info][name]}'
        nodeName: '{params[node_name]}'
        label: '{params[label]}'
      save_state: registered
    returns: '{actions[registered][body]}'
workloads:
  simulated-gpu-20s:
    target: python
    args:
    - -c
    - import time; time.sleep(20)
    units: 6
  cpu-3s:
    target: python
    args:
    - -c
    - import time; time.sleep(3)
    units: 0
  create-text-artifact:
    params:
      output_path:
        type: string
      request_id:
        type: string
    target: python
    args:
    - -c
    - from pathlib import Path; import sys; path = Path(sys.argv[1]); path.parent.mkdir(parents=True, exist_ok=True);
      path.write_text(f'Scheduler smoke artifact for request {sys.argv[2]}\n', encoding='utf-8')
    - '{params[output_path]}'
    - '{params[request_id]}'
    units: 0
pipeline:
  scheduler-smoke:
    nodes:
    - name: start
      run:
      - type: execute_routine
        routine: report_request_status
        args:
          status: processing
    - name: simulated-gpu-a
      depends_on: [start]
      before_run:
      - type: execute_routine
        routine: report_node_status
        args:
          status: running
        ignore_error: true
      run:
      - type: execute_workload
        workload: simulated-gpu-20s
      finally:
      - type: execute_routine
        routine: report_node_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target:
          - status
          expected: success
        ignore_error: true
      - type: execute_routine
        routine: report_node_status
        args:
          status: failed
        precondition:
          operator: node_state
          target:
          - status
          expected: failed
        ignore_error: true
      - type: write_json
        path: '{session[working_dir]}/simulated-gpu-a-finally.json'
        content:
          finalized: true
    - name: simulated-gpu-b
      depends_on: [start]
      before_run:
      - type: execute_routine
        routine: report_node_status
        args:
          status: running
        ignore_error: true
      run:
      - type: execute_workload
        workload: simulated-gpu-20s
      finally:
      - type: execute_routine
        routine: report_node_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target:
          - status
          expected: success
        ignore_error: true
      - type: execute_routine
        routine: report_node_status
        args:
          status: failed
        precondition:
          operator: node_state
          target:
          - status
          expected: failed
        ignore_error: true
      - type: write_json
        path: '{session[working_dir]}/simulated-gpu-b-finally.json'
        content:
          finalized: true
    - name: cpu-check
      depends_on: [start]
      before_run:
      - type: execute_routine
        routine: report_node_status
        args:
          status: running
        ignore_error: true
      run:
      - type: execute_workload
        workload: cpu-3s
      finally:
      - type: execute_routine
        routine: report_node_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target:
          - status
          expected: success
        ignore_error: true
      - type: execute_routine
        routine: report_node_status
        args:
          status: failed
        precondition:
          operator: node_state
          target:
          - status
          expected: failed
        ignore_error: true
    - name: complete
      depends_on:
      - simulated-gpu-a
      - simulated-gpu-b
      - cpu-check
      - artifact-upload
      before_run:
      - type: execute_routine
        routine: report_node_status
        args:
          status: running
        ignore_error: true
      - type: write_json
        path: '{session[working_dir]}/scheduler-smoke-complete.json'
        content:
          complete: true
      finally:
      - type: execute_routine
        routine: report_node_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target:
          - status
          expected: success
        ignore_error: true
      - type: execute_routine
        routine: report_node_status
        args:
          status: failed
        precondition:
          operator: node_state
          target:
          - status
          expected: failed
        ignore_error: true
      - type: execute_routine
        routine: report_request_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target: [status]
          expected: success
      postcondition:
        operator: file_exists
        path: '{session[working_dir]}/scheduler-smoke-complete.json'
    - name: artifact-upload
      depends_on: [start]
      context:
        artifact_path: '{session[working_dir]}/{request[requestId]}/scheduler-smoke.txt'
      before_run:
      - type: execute_routine
        routine: report_node_status
        args:
          status: running
        ignore_error: true
      run:
      - type: execute_workload
        workload: create-text-artifact
        args:
          output_path: '{artifact_path}'
          request_id: '{request[requestId]}'
      after_run:
      - type: execute_routine
        routine: upload_artifact
        args:
          artifact_path: '{artifact_path}'
          artifact_id: scheduler-smoke-text
          node_name: '{node[name]}'
          label: Scheduler smoke text
          content_type: text/plain; charset=utf-8
        save_state: registered_artifact
      finally:
      - type: execute_routine
        routine: report_node_status
        args:
          status: succeeded
        precondition:
          operator: node_state
          target:
          - status
          expected: success
        ignore_error: true
      - type: execute_routine
        routine: report_node_status
        args:
          status: failed
        precondition:
          operator: node_state
          target:
          - status
          expected: failed
        ignore_error: true
