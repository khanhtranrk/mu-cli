  - name: Yue Liang Zhao Hui Lai
    style: "Mandarin Chinese modern folk ballad, acoustic guitar, bamboo flute, soft percussion, sincere vocal with a warm singalong chorus"
    lyrics: |
      [Verse 1]
      月亮照回来，照亮窗边的旧书桌，
      照亮母亲种下的薄荷和栀子花。
      我离开那天，行李装得太满，
      却忘了带走门口那句慢慢回家。
      城市的夜很深，灯火挤在玻璃上，
      每个人都像赶路，却说不清要去哪。
      我把疲惫藏进没有寄出的信里，
      直到一阵晚风，把故乡的味道吹来。

      [Pre-Chorus]
      走过多少街巷，越过多少人海，
      总有一扇窗，为我留着等待。

      [Chorus]
      月亮照回来，照在回家的路上，
      照过旧桥流水，也照过新的远方。
      若我走得太久，请替我把灯点亮，
      我会带着风霜，也带着梦回到你身旁。
      月亮照回来，照见脸上的时光，
      原来最深的牵挂，从来不需要说谎。

      [Verse 2]
      父亲把院门修好，换上新的木闩，
      他说老屋漏雨的地方已经补上。
      邻居家的孩子长高了许多，
      追着一只纸飞机跑过晒谷场。
      我坐在门槛边听他们说近况，
      也说起这些年跌跌撞撞的愿望。
      没有人笑我绕了很远的弯路，
      只把热茶推近，说先吃饭再讲。

      [Verse 3]
      清晨我陪母亲走到河边，
      她认出每一棵树，也记得每一道弯。
      河水带走落叶，却留下岸边的青苔，
      像日子带走许多，却把温柔留下来。
      离开时我没有再说永远不走，
      也不再害怕远方会把自己改变。
      因为家的方向不是一条固定的线，
      是有人知道我的名字，等我回来。

      [Bridge]
      若你也在陌生城市醒来，
      看一看今晚的月亮吧。
      它照过每一扇亮着的窗，
      也照着你走过的路和想念的人。

      [Final Chorus]
      月亮照回来，照在回家的路上，
      照过旧桥流水，也照过新的远方。
      若你走得太久，请记得把灯点亮，
      总有一份牵挂，会陪你走过漫长。
      月亮照回来，照见我们脸上的时光，
      原来最深的牵挂，不会被距离遗忘。
