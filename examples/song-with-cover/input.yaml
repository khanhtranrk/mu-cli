  - name: Hoshikuzu No Toshokan
    style: "Japanese dream pop, soft piano, brushed drums, ambient guitar, delicate vocal that grows into a luminous orchestral refrain"
    lyrics: |
      [Verse 1]
      閉館時間を過ぎた図書館で
      雨の匂いが本の背表紙に残る
      返し忘れた一冊を抱えたまま
      窓辺の椅子に静かに座った
      誰かの旅を描いた古い物語
      ページの間から銀杏の葉が落ちる
      何年も前の秋を閉じ込めた色が
      今夜の私に小さく話しかける

      [Pre-Chorus]
      読み終えた言葉も消えはしない
      心の奥で星のように光る

      [Chorus]
      星屑の図書館で　夢を借りていこう
      まだ知らない世界の扉を開こう
      誰かが残した一行の願いが
      暗い夜道を照らす灯りになる
      いつか返すその日まで　大切に抱いて
      私だけの物語を続けていこう

      [Verse 2]
      窓の外では終電が走り去り
      街の明かりが水たまりに揺れる
      机に並んだ名も知らない人たちも
      それぞれの明日を胸に帰っていく
      司書さんは鍵をかける前に
      「またおいで」と柔らかく笑った
      その短い言葉の余白の中に
      帰る場所を見つけた気がした

      [Verse 3]
      春になればこの本を返しに来よう
      新しい誰かがページを開くように
      私が書きためた小さな詩も
      いつか誰かの夜に届くだろうか
      完璧な答えを見つけなくてもいい
      読み進めるたび景色は変わる
      しおりの位置を明日に置いて
      朝の光へ歩き出していく

      [Bridge]
      物語は終わるたび　次の声を呼ぶ
      ひとりで読んだ夜も　誰かにつながる
      静かな頁の奥で　未来が息をする
      その小さな音を忘れないで

      [Final Chorus]
      星屑の図書館で　夢を借りていこう
      まだ知らない世界の扉を開こう
      誰かが残した一行の願いを
      今度は私が誰かへ手渡そう
      いつか返すその日まで　大切に抱いて
      私だけの物語を歌っていこう
