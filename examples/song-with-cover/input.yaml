  - name: After The Last Bell
    style: "English piano-driven alternative pop, nostalgic electric guitar, live drums, layered youthful harmonies and an anthemic final refrain"
    lyrics: |
      [Verse 1]
      The last bell rang through the old brick hallway,
      And every locker swallowed one more year.
      We signed our names on the back of a yearbook,
      Made promises too large to fit in there.
      The gym was empty but the floor still glittered
      With paper stars from last night's dance.
      We stood beneath the scoreboard after midnight,
      Afraid to call this ending a beginning.

      [Pre-Chorus]
      We had no map and hardly any money,
      But every road looked possible that night.

      [Chorus]
      After the last bell, the world opens wide,
      With a thousand wrong turns and a thousand new skies.
      We will lose our way, we will change our minds,
      We will find each other in the passing lights.
      Keep the song we sang on the football field;
      Keep the names we wrote where the paint wore thin.
      After the last bell, whatever comes next,
      We are more than the place where we began.

      [Verse 2]
      Years later, we met in a crowded station,
      With tired eyes and stories we had earned.
      Someone had a baby, someone changed their name,
      Someone came back after every bridge had burned.
      We laughed about the band that missed its entrance,
      The science fair volcano made of clay.
      For a little while the years became a hallway,
      And we were young enough to stay all day.

      [Verse 3]
      Some of us stayed near the old river,
      Some crossed oceans, some never settled down.
      The empty lot is now a corner market,
      The library still keeps the windows facing town.
      I pass the school when evening paints it gold,
      And hear the distant practice of a song.
      The bell may ring for someone else tomorrow;
      The things we learned still travel with us on.

      [Bridge]
      Growing up is not a door that closes;
      It is a road that bends beyond our sight.
      We carry every borrowed bit of courage,
      And lend it when a friend can't find the light.

      [Final Chorus]
      After the last bell, the world opens wide,
      With a thousand wrong turns and a thousand new skies.
      We have lost our way, we have changed our minds,
      We have found each other in the passing lights.
      Keep the song we sang on the football field;
      Keep the names we wrote where the paint wore thin.
      After the last bell, whatever comes next,
      We are more than the place where we began.
