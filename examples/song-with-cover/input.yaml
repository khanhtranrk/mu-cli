songs:
  - name: The Orchard Keeps Time
    style: "English indie folk, fingerpicked acoustic guitar, warm cello, steady percussion, intimate lead vocal with a wide final chorus"
    lyrics: |
      [Verse 1]
      At the edge of town the orchard leans toward morning,
      Old branches comb the mist from the fields.
      My grandfather taught me the names of every tree,
      And how a patient hand can coax a branch to yield.
      We carried tin pails through the rows in September,
      With cider-sweet air settling into our clothes.
      He said the years were rings beneath the bark,
      Each one a quiet record of what grows.

      [Pre-Chorus]
      Some seasons give and some seasons take,
      Some roots hold fast while the high limbs shake.

      [Chorus]
      The orchard keeps time when the clocks run late,
      In blossom and frost, in the fallen fruit.
      We are only passing through its open gate,
      But the ground remembers every careful root.
      If I lose my way, let the old trees show
      How to bend with the weather and still grow.

      [Verse 2]
      Now the ladder rests where the tall grass gathers,
      And his empty chair looks west at the hill.
      I came back alone with a box of pruning shears,
      Unsure if I could learn the work he taught me still.
      A little green leaf opened under my fingers,
      Though the branch had been broken by the winter wind.
      I heard his laugh in the crows above the barn,
      And felt the long work of beginning again.

      [Verse 3]
      The neighbors came with jars and borrowed baskets,
      Their children raced the rows at the end of the day.
      We pressed the apples while the sunset turned copper,
      And saved the smallest seeds to give away.
      One day these trees will shade a different family,
      Who'll learn that care is more than what we own.
      The orchard will keep making room for the future,
      Long after our footsteps have gone home.

      [Bridge]
      Nothing we love stays still forever;
      The hand lets go, the roots hold together.
      A life can end and still leave a way
      For another green morning to find the day.

      [Final Chorus]
      The orchard keeps time when the clocks run late,
      In blossom and frost, in the fallen fruit.
      We are only passing through its open gate,
      Yet the ground remembers every careful root.
      If I lose my way, let the old trees show
      How to bend with the weather and still grow.
    cover_prompt: "Reflective indie-folk album art, an old apple orchard at dawn in early autumn, one weathered wooden ladder beneath a broad tree, a young person gathering apples as neighbors arrive with baskets, mist over distant fields, soft copper and moss-green colors, natural cinematic light, no text"
    cover_with: 1280
    cover_height: 768

  - name: Shan Hai Zhi Jian
    style: "Mandarin Chinese cinematic folk pop, guzheng accents, piano, warm strings, restrained verses and an expansive hopeful chorus"
    lyrics: |
      [Verse 1]
      我把旧地图折进背包，沿着清晨出发，
      山影落在肩上，像一句没说完的话。
      车窗外的村庄慢慢退成远处的灯，
      妈妈在门前挥手，风替我回答。
      我曾以为远方会把迷惘全部带走，
      直到夜色降临，才听见心里的潮声。
      原来每一段路都藏着熟悉的回音，
      把走散的勇气，一点一点唤醒。

      [Pre-Chorus]
      山很高，海很宽，脚步也会疲倦，
      可天亮以前，星光一直没有走远。

      [Chorus]
      在山海之间，我寻找自己的方向，
      让风吹过脸庞，让河流记住愿望。
      不必赶在谁的前面，不必假装坚强，
      一步一步走过黑夜，也能走到有光的地方。
      若故乡在身后，若明天仍漫长，
      心里那盏灯，会陪我越过山海的回响。

      [Verse 2]
      我遇见修桥的老人，听他讲洪水与春天，
      他把一颗小石子放进我的掌心里面。
      他说河水绕过岩石，从来不是认输，
      是找到另一条路，仍然奔向平原。
      我把这句话带进拥挤陌生的城市，
      在窗边种下一盆从家乡带来的花。
      雨落在屋檐，像远方寄来的信，
      写着不管走多远，总有人等我回家。

      [Verse 3]
      后来我学会停下，看看路旁的云，
      学会把没完成的梦，放进明天继续。
      那些曾经害怕失去的名字和声音，
      成了我穿过风雨时，最温柔的地图。
      山那边仍有山，海的尽头还有潮汐，
      可我不再要求答案一次说清。
      当脚下这一寸土地终于变得熟悉，
      我知道远行也能让人回到自己。

      [Bridge]
      若你也在夜路上，别急着追赶太阳，
      每颗星都用自己的速度发亮。
      把疲惫交给风，把希望留在胸膛，
      明天会从你愿意再迈步的地方开始。

      [Final Chorus]
      在山海之间，我找到了自己的方向，
      让风吹过脸庞，让河流带走忧伤。
      不必赶在谁的前面，我们并肩歌唱，
      一步一步走过黑夜，就能走到有光的地方。
      无论故乡多远，无论明天多漫长，
      心里那盏灯，会陪我们越过山海的回响。
    cover_prompt: "Mandarin folk-pop album cover, a lone traveler on a mountain pass looking toward a distant silver sea at sunrise, a small hometown map tucked into a backpack, winding river below, layered blue mountains and pale gold clouds, poetic cinematic landscape, no text"
    cover_with: 1280
    cover_height: 768

  - name: Yoake No Eki
    style: "Japanese alternative pop, piano-led verses, understated drums, shimmering guitar, emotional strings opening into a bright chorus"
    lyrics: |
      [Verse 1]
      夜明け前の駅に　白い息が浮かぶ
      古いベンチの端で　切符を握りしめた
      改札の向こうには　眠った町の灯り
      君が笑った坂道も　窓の外へ消える
      何度も書き直した　短い手紙の言葉
      伝えられないまま　鞄の底にしまう
      発車を告げる声が　静けさをほどいて
      まだ知らない明日へ　列車が走り出す

      [Pre-Chorus]
      離れることだけが　別れじゃないと
      風の音がそっと　教えてくれた

      [Chorus]
      夜明けの駅から　僕らは旅立つ
      それぞれの夢を　胸に抱きながら
      遠く離れても　同じ空を見上げ
      迷った夜には　あの日の歌を思い出す
      さよならの先に　続いている道を
      小さな勇気で　歩いていこう

      [Verse 2]
      窓に映る顔は　少し大人びていて
      知らない町の名前が　ひとつずつ近づく
      雨の日のホームで　傘を寄せた人や
      眠れない夜に読んだ　本のページの匂い
      出会った人の声が　心に積もるたび
      帰る場所の形も　少しずつ変わった
      それでも夕暮れに　遠い汽笛を聞けば
      あの町の川辺まで　想いは戻っていく

      [Verse 3]
      いつか同じ駅で　また会える日が来たら
      あの日言えなかった　言葉を渡したい
      大きな夢の話も　失敗した話も
      笑いながら話せる　自分でいたいんだ
      旅は終わるために　始まるのではなく
      新しい景色の中　自分を知るため
      発車ベルの余韻が　胸の奥で鳴る
      その音を道しるべに　今日も歩いていく

      [Bridge]
      さよならは扉を閉じる音じゃない
      次のページを開く　合図になる
      遠くの君にも　この歌が届くなら
      同じ朝を生きていると伝えたい

      [Final Chorus]
      夜明けの駅から　僕らは旅立つ
      それぞれの夢を　今も抱きながら
      遠く離れても　同じ空の下で
      迷った夜には　あの日の歌を口ずさむ
      さよならの先に　続いている道を
      確かな足音で　歩いていこう
