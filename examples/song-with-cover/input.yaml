- name: Ban Công Đón Nắng
  style: "Vietnamese acoustic pop, fingerstyle guitar, đàn tranh accents, light hand percussion, sincere vocal and a bright singalong chorus"
  lyrics: |
    [Verse 1]
    Ban công nhà tôi vừa đủ hai chậu cây,
    Một chiếc ghế con và chiếc ly còn đọng nước.
    Sáng nào thành phố cũng thức bằng tiếng xe,
    Nắng len qua dây phơi, chạm vào mầm lá mới.
    Chị hàng xóm tầng trên cho tôi nhánh húng,
    Bác bảo vệ đem xuống một túi đất mềm.

    [Pre-Chorus]
    Chẳng cần một khu vườn thật rộng,
    Một khoảng xanh cũng đủ dịu lòng.

    [Chorus]
    Ban công đón nắng, tôi trồng ngày mai,
    Gieo vào chiếc hộp nhỏ một màu xanh trở lại.
    Dẫu ngoài kia phố vẫn vội vàng,
    Mình ngồi bên nhau nghe chim về ngang.
    Từ vài chiếc lá, từ lời hỏi han,
    Cả khu nhà bỗng hóa thành xóm làng.

    [Verse 2]
    Em bé nhà bên hỏi cây kia tên gì,
    Tôi cười bảo cứ gọi là cây của chúng mình.
    Mỗi tuần em tưới bằng chiếc bình màu đỏ,
    Rồi kể cho mầm non nghe chuyện ở trường.
    Những người đi làm về thường dừng một chút,
    Để lại vài hạt giống, vài câu chuyện vui.

    [Verse 3]
    Mùa mưa kéo đến, mái hiên vang nhịp,
    Chúng tôi kê chậu vào sát bên nhau.
    Một cây cà chua nghiêng mình qua lan can,
    Chia quả đầu tiên cho căn phòng cuối dãy.
    Thành phố vẫn lớn lên qua từng ô cửa,
    Nhưng lòng người cũng có chỗ để xanh.

    [Bridge]
    Nếu hôm nay mệt nhoài vì bao ngã rẽ,
    Hãy ngồi xuống đây, nghe gió đi qua.
    Ta chăm một mầm cây bằng đôi tay nhỏ,
    Và nhận lại một mùa vui quanh nhà.

    [Final Chorus]
    Ban công đón nắng, tôi trồng ngày mai,
    Gieo vào chiếc hộp nhỏ những điều tốt đẹp.
    Dẫu ngoài kia phố vẫn vội vàng,
    Mình cùng nhau giữ một khoảng bình an.
    Từ vài chiếc lá, từ lời hỏi han,
    Cả khu nhà bỗng hóa thành xóm làng.
