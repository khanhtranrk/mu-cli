- name: 雨粒の温室
  style: "Japanese dream pop, delicate piano and clean guitar, gentle electronic drums, airy vocal with a luminous string-backed refrain"
  lyrics: |
    [Verse 1]
    雨粒の温室に　午後の光が落ちる
    ガラスの屋根を伝い　小さな川になる
    名札のない苗を　君は両手で抱いて
    ここなら急がずに　育っていいと言う
    通りを走るバスの　音が遠くほどけ
    湿った土の匂いが　胸の奥に満ちる

    [Pre-Chorus]
    うまく咲けない日にも
    根は静かに伸びている

    [Chorus]
    雨粒の温室で　明日を育てよう
    ひとつずつの葉に　名前をつけながら
    曇った空の向こう　青さは消えない
    迷いも涙も　土に返して
    いつか開く花が　まだ見えなくても
    君と水をやる　その時間が好き

    [Verse 2]
    古い鉢のすみに　折れた枝を見つけ
    捨てずに挿し木して　窓辺へ置いてみた
    夕方の喫茶店　店主が持ってきた
    旅先の種袋　裏に日付がある
    名前を知らない花も　色を選ぶように
    私たちの今日を　少しずつ染めていく

    [Verse 3]
    季節が何度か過ぎ　屋根を打つ音にも
    それぞれ違う顔が　あると気づいたよ
    強い雨の夜には　鉢を奥へ運び
    晴れ間がのぞいたら　扉を開け放つ
    誰かのための場所が　街に増えていけば
    ひとりで抱えた冬も　やわらいでいく

    [Bridge]
    咲く日を決めなくていい
    比べなくてもいい
    光の届くところまで
    一緒に根を伸ばそう

    [Final Chorus]
    雨粒の温室で　明日を育てよう
    ひとつずつの葉に　願いを込めながら
    曇った空の向こう　青さは消えない
    迷いも涙も　土に返して
    いつか開く花が　まだ見えなくても
    君と水をやる　この時間を歌う
