  - name: Letters To The Deep
    style: "English atmospheric rock, rolling toms, electric guitar swells, piano, earnest vocal, dramatic ocean-sized final chorus"
    lyrics: |
      [Verse 1]
      We wrote our questions on a paper boat,
      And let it drift beyond the harbor wall.
      The tide took every careless word we spoke,
      Then brought back shells too small to hold it all.
      My sister kept a jar of beach glass,
      Green as the sea beneath a cloudy sky.
      She said the shore remembers every footstep,
      Even when the names and footprints dry.

      [Pre-Chorus]
      Beneath the waves, the dark is full of sound;
      The world is breathing where we cannot see.

      [Chorus]
      Send our letters to the deep blue water,
      Ask the turning tide to carry them through.
      We were born beside this restless border,
      We belong to the wide and changing blue.
      If we take more than the earth can give us,
      Let us learn to mend what we undo.
      Leave a cleaner coast for those who follow;
      Let the sea keep singing something true.

      [Verse 2]
      At dawn we walked the cove with canvas sacks,
      While gulls drew circles over broken foam.
      We found a net tangled around the rocks,
      And pulled it free before the boats came home.
      A child held up a bottle cap like treasure,
      Then asked who had forgotten it behind.
      We had no easy answer for the question,
      So we began with what we could remove.

      [Verse 3]
      The harbor lights came on across the water,
      Each window like a promise on the shore.
      The fishermen repaired their weathered ropes,
      And neighbors shared the work from door to door.
      No single hand can turn the tide alone,
      But many hands can change what reaches land.
      Tomorrow starts in ordinary choices,
      In how we care for what we do not own.

      [Bridge]
      The ocean does not need our grand promises;
      It needs the patient work we do each day.
      A thousand small repairs can shape a future,
      Where life has room to find another way.

      [Final Chorus]
      Send our letters to the deep blue water,
      Let the turning tide carry our reply:
      We will guard the fragile, living border,
      Keep the shore and open sky in view.
      If we take more than the earth can give us,
      We can mend the harm and start anew.
      Leave a cleaner coast for those who follow;
      Let the sea keep singing something true.
    cover_prompt: "Atmospheric rock album artwork, a small coastal community cleaning a rocky shore at dawn, reusable canvas sacks, glassy blue water and seabirds, harbor lights fading as the sun rises, environmental care shown with hope rather than disaster, cinematic sea blues and silver, no text"
    cover_with: 1280
    cover_height: 768

  - name: Zhi Yuan De Feng Zheng
    style: "Mandarin Chinese acoustic pop, guzheng and piano, light hand percussion, tender father-child duet feeling, uplifting full-band chorus"
    lyrics: |
      [Verse 1]
      父亲把竹条削成细细的骨架，
      我在旧报纸上画了一只蓝色的鸟。
      浆糊粘住指尖，窗外风吹过院墙，
      他笑着说，别怕，风会帮你飞高。
      我踮起脚尖，把线轴握得很紧，
      小小的纸鸢摇摇晃晃离开屋檐。
      那一刻天空像突然打开的门，
      我追着它跑过田埂和金色的麦田。

      [Pre-Chorus]
      线在手里，风在远方，
      你说放开一点，它才看得见天光。

      [Chorus]
      飞吧，飞吧，飞向更远的地方，
      穿过白云，越过山岗。
      我会记得你掌心的温度，
      和那句跌倒以后也要自己站起来的话。
      飞吧，飞吧，风再大也别慌张，
      只要心里有家，远方就不再遥远。

      [Verse 2]
      后来我背上行囊，离开熟悉的小城，
      车站的钟声把夏天敲得很长。
      父亲没有多说，只把一把旧伞递给我，
      叮嘱我遇见暴雨，先找地方躲藏。
      城市的霓虹很亮，夜晚却有些空，
      我在加班的窗边想起那只纸鸢。
      电话那头他说院里的桂花开了，
      风吹过的时候，香气越过了山。

      [Verse 3]
      多年以后我带着自己的孩子回家，
      父亲的头发已经像冬天一样白。
      我们重新削竹条，重新糊好纸面，
      他握住孩子的手，让她学着放线。
      纸鸢飞过屋顶，飞过老树的影子，
      三个人的笑声落在晚霞之间。
      我突然明白离开不是忘记故乡，
      是把它的温柔带到每一个明天。

      [Bridge]
      线会松，也会紧，风会变换方向，
      爱不是把谁留在身旁。
      是你敢去看更远的天，
      我仍在这里，为你留一盏灯光。

      [Final Chorus]
      飞吧，飞吧，飞向更远的地方，
      穿过白云，越过山岗。
      我会记得你掌心的温度，
      也把这份温柔交到下一双手上。
      飞吧，飞吧，风再大也别慌张，
      只要心里有家，我们就不会走散。
