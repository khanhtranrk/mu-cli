- name: 우산을 나누는 골목
  style: "Korean indie soul, warm electric piano, mellow bass, understated groove, intimate vocal opening into a rich communal chorus"
  lyrics: |
    [Verse 1]
    갑자기 소나기가 쏟아진 퇴근길
    나는 편의점 처마 밑에 서 있었어
    옆집 아주머니는 장바구니를 내려놓고
    젖은 화분을 품에 안아 올렸지
    맞은편 가게 불빛이 하나둘 켜지고
    누군가 접어 둔 우산을 펼쳐 들었어

    [Pre-Chorus]
    빗소리에 묻혀 있던 인사말
    오늘은 조금 더 오래 머물러

    [Chorus]
    우산을 나누는 골목 끝에서
    우리는 서로의 이름을 배워
    비가 그치면 각자의 길로 가도
    따뜻한 한마디는 오래 남아
    작은 처마 아래 모인 마음들이
    어두운 저녁을 환하게 밝혀

    [Verse 2]
    이사 온 학생은 길을 물어보았고
    빵집 주인은 아직 따뜻한 식빵을 건넸어
    오래 혼자 지내던 아저씨는 웃으며
    내일은 화분에 새 흙을 갈겠다고 했지
    빗물이 계단을 따라 천천히 흘러가고
    낯선 얼굴 사이에 익숙한 온기가 생겨

    [Verse 3]
    몇 주 뒤 골목에 작은 의자가 놓였어
    누군가는 책을 두고 누군가는 꽃을 심었지
    서두르던 발걸음이 잠시 쉬어 가고
    창문마다 저녁 냄새가 번져 나왔어
    큰일을 해낸 것은 아무도 아니었지만
    여기 사는 하루가 조금 달라졌어

    [Bridge]
    가진 것이 많아서 건네는 게 아냐
    오늘의 빈자리를 함께 내어 주는 거야
    한 사람의 불빛이 옆집을 비추면
    길은 생각보다 환해져

    [Final Chorus]
    우산을 나누는 골목 끝에서
    우리는 서로의 안부를 배워
    비가 그치고 계절이 바뀌어도
    따뜻한 한마디는 오래 남아
    작은 처마 아래 모인 마음들이
    내일의 저녁도 환하게 밝혀
