- name: Paper Constellations
  style: "English indie pop, muted electric piano, picked guitar, brushed drums, intimate lead vocal rising into a wide layered chorus"
  lyrics: |
    [Verse 1]
    The laundromat is glowing at a quarter after two,
    A baker wheels his bicycle beneath the traffic lights.
    I pin our little wishes to a map above my desk,
    Each one a paper window in the middle of the night.
    The radio is catching someone's song from miles away,
    A voice that makes this quiet room feel less alone.

    [Pre-Chorus]
    We are dots of light on different streets,
    Still keeping time with the same heartbeat.

    [Chorus]
    Make a constellation out of where we are,
    A thousand little windows, every one a star.
    Though the miles between us stretch like open sea,
    Leave a little light on; I'll be looking for you.
    When the city turns its noise into the morning rain,
    We'll find one another in the glow again.

    [Verse 2]
    There's a nurse on the last train counting stops in her head,
    A student in the stairwell humming softly to a tune.
    Someone walks a sleepy dog beneath the corner store,
    Someone draws a yellow sun across a darkened room.
    We never learn the names of all the people passing by,
    But every small kindness leaves a signal in the sky.

    [Verse 3]
    I used to think that distance was a door that wouldn't move,
    A line across the map that only kept us far apart.
    Now every message sent, each borrowed song, each call,
    Makes another crossing in the atlas of the heart.
    So when your own horizon feels too heavy to defend,
    Look up; the scattered lights are learning how to bend.

    [Bridge]
    No grand design, no perfect view,
    Just ordinary people seeing each other through.
    A window lit, a hand held out,
    That's what a constellation is about.

    [Final Chorus]
    Make a constellation out of where we are,
    A thousand little windows, every one a star.
    Though the miles between us stretch like open sea,
    Leave a little light on; I'll be looking for you.
    When the city turns its noise into the morning rain,
    We'll find one another in the glow again.
  cover_prompt: "English indie-pop album artwork, a small apartment window glowing above a rainy midnight city street, several distant windows lit across rooftops like a constellation, a paper star map on the sill and a radio playing softly, intimate cinematic blue and gold palette, no text"
  cover_with: 1280
  cover_height: 768

- name: 潮汐邮局
  style: "Mandarin Chinese modern folk pop, mellow piano, pipa flourishes, soft electronic pulse, clear vocal and a broad uplifting chorus"
  lyrics: |
    [Verse 1]
    海边有间邮局，门牌被盐风吹旧，
    窗台摆着几只空瓶，收集退潮以后。
    老邮差骑车穿过晃动的白色灯塔，
    把没写完的心事送到远方的手。
    我寄出一张明信片，没有地址和姓名，
    只画了一朵云，和一片很慢的海。

    [Pre-Chorus]
    潮水带走沙上的字，
    却带不走想说的话。

    [Chorus]
    请把我的信交给潮汐，
    让它越过岛屿，越过沉默的距离。
    如果你也在某个岸边等消息，
    听见浪花，就当作我在回应你。
    世界很大，归途不必着急，
    每一次涨落，都把我们带近。

    [Verse 2]
    邮局的木桌留着许多陌生人的名字，
    有人写给离开的船，有人写给未来的自己。
    一个孩子把贝壳装进信封，贴上邮票，
    说想问月亮，为什么夜夜跟着海走。
    老邮差笑着盖章，印泥像一轮红日，
    他说有些答案，要等风平浪静才清晰。

    [Verse 3]
    黄昏时我们沿着堤岸捡起漂来的纸片，
    把湿透的愿望摊在屋檐下晾干。
    每一行字都不完整，却有不同的笔迹，
    像许多人在黑夜里递来的一盏灯。
    后来我也学会把心事折成小小的船，
    不问它何时抵达，只祝它一路平安。

    [Bridge]
    若你的信还没有回音，
    别把等待当成孤单。
    海会记得每一次托付，
    天亮时替我们继续传。

    [Final Chorus]
    请把我的信交给潮汐，
    让它越过岛屿，越过沉默的距离。
    如果你也在某个岸边等消息，
    听见浪花，就当作我在回应你。
    世界很大，归途不必着急，
    每一次涨落，都把我们带近。
