  - name: Mua Nuoc Noi
    style: "Vietnamese contemporary folk, dan tranh and acoustic guitar, gentle river percussion, expressive warm vocal and communal chorus"
    lyrics: |
      [Verse 1]
      Nước từ thượng nguồn về qua bờ tre trước ngõ,
      Con đường quen bỗng hóa thành một nhánh sông.
      Má xắn quần, chèo xuồng qua vườn đầy bông súng,
      Ba kê cao chiếc radio tránh mưa dông.
      Lũ trẻ cười vang khi cá linh về theo nước,
      Khói bếp thơm bay quấn lấy mái nhà tranh.
      Mùa nước nổi mang phù sa về bồi đắp,
      Dẫu mênh mông, quê mình vẫn xanh lành.

      [Pre-Chorus]
      Nước lên thì mình kê thêm chiếc sàn,
      Gió đổi chiều thì nắm lấy tay nhau.

      [Chorus]
      Ơi con nước, đưa mùa qua đồng rộng,
      Chở tiếng hò đi khắp những bờ xa.
      Nhà mình nhỏ mà tình người thì rộng,
      Có nhau rồi, sóng lớn cũng hóa hiền hòa.
      Khi con nước ròng, bùn non còn ở lại,
      Mai lúa lên xanh từ những tháng ngày qua.

      [Verse 2]
      Ngoại kể ngày xưa qua sông không có bến,
      Người gọi đò bằng ngọn đèn dầu leo lét đêm.
      Ngoại giữ trong chum vài hạt giống tốt,
      Chờ đất khô rồi gieo xuống cạnh thềm.
      Năm nay con về khi mùa mưa vừa chạm ngõ,
      Thấy tóc ngoại bạc thêm dưới mái hiên nhà.
      Ngoại hỏi thành phố có còn nhiều khói bụi,
      Con chỉ cười: ở đâu cũng nhớ phù sa.

      [Verse 3]
      Mấy đứa bạn xưa giờ đi làm xa xứ,
      Đứa gửi tiền về, đứa gửi tiếng cười qua điện thoại.
      Tụi mình hẹn nhau bên bờ đê đầu xóm,
      Chia nồi canh chua, kể chuyện những ngày dài.
      Trăng rải bạc lên mặt nước đang lặng,
      Một chiếc xuồng chở tiếng hát về ngang.
      Con hiểu quê nhà đâu chỉ là nơi trở lại,
      Mà là cách người ta đợi nhau sang.

      [Bridge]
      Nước có lúc dâng cao, có khi lùi xa,
      Đời người cũng qua bao mùa nắng mưa.
      Cứ gieo điều tử tế vào lòng đất,
      Rồi ngày mai sẽ nở những bông mùa.

      [Final Chorus]
      Ơi con nước, đưa mùa qua đồng rộng,
      Chở tiếng hò đi khắp những bờ xa.
      Nhà mình nhỏ mà tình người thì rộng,
      Có nhau rồi, sóng lớn cũng hóa hiền hòa.
      Khi con nước ròng, phù sa còn ở lại,
      Mai lúa lên xanh trên đất mẹ bao la.
    cover_prompt: "Vietnamese folk album cover during the Mekong flood season, a family rowing a small wooden boat past a stilted riverside home, water lilies and floating hyacinths, children laughing as fishers bring in their nets, warm cooking smoke and soft monsoon light, vivid but natural, no text"
