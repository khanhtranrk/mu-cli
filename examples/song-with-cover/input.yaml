  - name: Qua Mien Gio Cat
    style: "Vietnamese cinematic folk rock, acoustic guitar, dan bau lines, hand drums, resilient vocal and a broad communal final chorus"
    lyrics: |
      [Verse 1]
      Gió từ miền cát thổi qua hàng phi lao,
      Mang vị mặn của biển và màu nắng trên vai.
      Mẹ gánh nước về khi trời chưa sáng,
      Bóng mẹ dài qua những vệt cát khô rang.
      Cha vá lại mái nhà sau mùa bão cũ,
      Buộc từng tàu lá dừa vào khung tre cong.
      Trong sân nhỏ, em gieo mấy hạt đậu,
      Tin một ngày xanh sẽ trở lại trên đồng.

      [Pre-Chorus]
      Đường xa thì đi chậm, trời cao cứ ngước nhìn,
      Mỗi bàn tay góp lại, cát cũng thành đất lành.

      [Chorus]
      Qua miền gió cát, ta đi cùng nhau,
      Dẫu chân trần bỏng rát dưới trời cao.
      Giữ một giọt mưa trong lòng bàn tay,
      Giữ tiếng ru nhà mình qua tháng ngày.
      Khi biển nổi giông, khi đồng khô nứt nẻ,
      Tình người còn xanh như lá sau mưa.
      Qua miền gió cát, ta đi cùng nhau,
      Bình minh sẽ tìm về trên mái nhà.

      [Verse 2]
      Xóm trên góp tre, xóm dưới góp công,
      Đào một con mương dẫn nước qua vườn.
      Bà mang nồi chè ra ngồi bên ngõ,
      Trẻ con chuyền tay những trái sim thơm.
      Có người đi xa gửi về chiếc máy bơm,
      Có người giữ giống lúa chịu hạn trong chum.
      Mùa đầu tiên nước về ngang bờ ruộng,
