# Variant: collect/upload artifacts in node finally, before node_finished.
# Uploads remain required; missing files or upload errors fail the node.
# MasterFlow media example: lifecycle reports via events; required uploads via routines.
# Cached outputs skip generation only; uploads still run with stable artifact IDs.
# Requires a configured MasterFlow worker; real execution downloads models and uses GPU tools.
entries:
  direct_flow:
    initialization: []
  master_flow:
    initialization:
    - type: execute_routine
      routine: send_notification
      args:
        title: Worker ready
        message: Initialization completed
      ignore_error: true
    finalization:
    - type: execute_routine
      routine: send_notification
      args:
        title: Worker ended
        message: Worker finished with status {entry[status]}.
      ignore_error: true
workloads:
  yue2:
    params:
      request:
        type: string
      output:
        type: string
      score:
        type: string
    target: '{sys[cache_dir]}/bin/yue-synth'
    args:
    - --model
    - '{sys[models][YuE2-3B-BF16]}'
    - --vae
    - '{sys[models][YuE2-Vae-F32]}'
    - --request
    - '{params[request]}'
    - --out
    - '{params[output]}'
    - --score
    - '{params[score]}'
    device_args:
    - --device
    - '{schedule[device_family]}{schedule[device_index]}'
    units: 3
  qwen-image:
    params:
      prompt:
        type: string
      cover_with:
        type: number
      cover_height:
        type: number
      output:
        type: string
    target: '{sys[cache_dir]}/bin/sd-cli'
    args:
    - --diffusion-model
    - '{sys[models][qwen-image-2.1-Q4_K_M]}'
    - --vae
    - '{sys[models][vae/qwen_image_2.1_vae_bf16]}'
    - --llm
    - '{sys[models][Qwen3-VL-8B-Instruct-UD-Q4_K_XL]}'
    - --flash-attn
    - off,diffusion=on
    - --prompt
    - '{params[prompt]}'
    - --steps
    - '24'
    - --cfg-scale
    - '5.0'
    - --sampling-method
    - euler
    - -W
    - '{params[cover_with]}'
    - -H
    - '{params[cover_height]}'
    - -o
    - '{params[output]}'
    device_args:
    - --backend
    - diffusion={schedule[device_family]}{schedule[device_index]},te={schedule[device_family]}{schedule[device_index]},vae={schedule[device_family]}{schedule[device_index]}
    units: 3
  demucs:
    params:
      input:
        type: string
      output:
        type: string
    target: demucs
    args:
    - -n
    - htdemucs
    - --two-stems=vocals
    - --shifts
    - '1'
    - -j
    - '2'
    - -o
    - '{params[output]}'
    - '{params[input]}'
    units: 1
    device_args:
    - -d
    - cuda:{schedule[device_index]}
  whisperx:
    params:
      input:
        type: string
      output:
        type: string
    target: whisperx
    args:
    - '{params[input]}'
    - --model
    - large-v3
    - --device
    - cuda
    - --batch_size
    - '4'
    - --output_dir
    - '{params[output]}'
    - --output_format
    - all
    units: 3
    device_args:
    - --device_index
    - '{schedule[device_index]}'
pipeline:
  song-with-cover:
    prepare:
    - type: execute_command
      save_state: prepare_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/YuE2-Vae-F32.gguf'
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - YuE2-Vae-F32.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: and
        props:
        - operator: file_exists
          path: '{sys[cache_dir]}/models/YuE2-Vae-F32.gguf'
        - operator: action_state
          target:
          - prepare_command
          - returncode
          expected: 0
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/YuE2-3B-BF16.gguf'
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - YuE2-3B-BF16.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/YuE2-3B-BF16.gguf'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf'
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - MERT-v2-FullSong-Q8_0.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf'
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - SheetSage2-Q8_0.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf'
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf'
      target: hf
      args:
      - download
      - unsloth/Qwen-Image-2.1-GGUF
      - qwen-image-2.1-Q4_K_M.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors'
      target: hf
      args:
      - download
      - unsloth/Qwen-Image-2.1-FP8
      - vae/qwen_image_2.1_vae_bf16.safetensors
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors'
    - type: execute_command
      skip_if:
        operator: file_exists
        path: '{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf'
      target: hf
      args:
      - download
      - unsloth/Qwen3-VL-8B-Instruct-GGUF
      - Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      - --local-dir
      - '{sys[cache_dir]}/models'
      postcondition:
        operator: file_exists
        path: '{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf'
    - type: execute_command
      skip_if:
        operator: exit_code
        target:
        - demucs
        - --help
      target: uv
      args:
      - tool
      - install
      - demucs
      - --with
      - wrapt
      - --with
      - numpy
      postcondition:
        operator: exit_code
        target:
        - demucs
        - --help
    - type: execute_command
      skip_if:
        operator: exit_code
        target:
        - whisperx
        - --help
      target: uv
      args:
      - tool
      - install
      - whisperx
      - --with
      - wrapt
      postcondition:
        operator: exit_code
        target:
        - whisperx
        - --help
    params:
      name:
        type: string
      style:
        type: string
      lyrics:
        type: string
      cover_prompt:
        type: string
      cover_with:
        type: number
        default: 1280
      cover_height:
        type: number
        default: 768
    nodes:
    - name: generate-song
      postcondition:
        operator: and
        props:
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
      precondition:
        operator: file_exists
        path: '{sys[cache_dir]}/bin/yue-synth'
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      - type: write_json
        path: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
        content:
          name: '{params[name]}'
          style: '{params[style]}'
          lyrics: '{params[lyrics]}'
      run:
      - type: execute_workload
        workload: yue2
        args:
          request: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
          output: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          score: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        skip_if:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
      finally:
      - type: execute_routine
        routine: upload_artifact
        args:
          artifact_path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          artifact_id: song-mp3
          node_name: '{node[name]}'
          label: Song audio
          content_type: audio/mpeg
      - type: execute_routine
        routine: upload_artifact
        args:
          artifact_path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
          artifact_id: song-abc
          node_name: '{node[name]}'
          label: ABC notation
          content_type: text/vnd.abc
    - name: generate-cover
      precondition:
        operator: file_exists
        path: '{sys[cache_dir]}/bin/sd-cli'
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/cover.png'
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      run:
      - type: execute_workload
        workload: qwen-image
        args:
          output: '{session[output_dir]}/{params[name]}/cover.png'
          prompt: '{params[cover_prompt]}'
          cover_with: '{params[cover_with]}'
          cover_height: '{params[cover_height]}'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/cover.png'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/cover.png'
      finally:
      - type: execute_routine
        routine: upload_artifact
        args:
          artifact_path: '{session[output_dir]}/{params[name]}/cover.png'
          artifact_id: cover-png
          node_name: '{node[name]}'
          label: Cover image
          content_type: image/png
    - name: separate-vocals
      postcondition: &id001
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
      depends_on:
      - generate-song
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/separated'
      run:
      - type: execute_workload
        workload: demucs
        args:
          output: '{session[output_dir]}/{params[name]}/separated'
          input: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
        postcondition: *id001
    - name: transcribe-vocals
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      depends_on:
      - separate-vocals
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/transcript'
      run:
      - type: execute_workload
        workload: whisperx
        args:
          output: '{session[output_dir]}/{params[name]}/transcript'
          input: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      finally:
      - type: execute_routine
        routine: upload_artifact
        args:
          artifact_path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
          artifact_id: transcript-json
          node_name: '{node[name]}'
          label: Vocal transcript
          content_type: application/json
routines:
  send_notification:
    params:
      title:
        type: string
      message:
        type: string
      tags:
        type: array
        default: []
    actions:
    - type: send_http_request
      url: '{session[server]}/api/notifications/send'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        title: '{params[title]}'
        message: '{params[message]}'
        tags: '{params[tags]}'
  report_node_status:
    params:
      status:
        type: string
      logs:
        type: array
        default: []
    actions:
    - type: send_http_request
      url: '{session[server]}/api/requests/report'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        id: '{request[requestId]}'
        node_states:
          '{node[name]}':
            status: '{params[status]}'
            logs: '{params[logs]}'
  report_request_status:
    params:
      status:
        type: string
    actions:
    - type: send_http_request
      url: '{session[server]}/api/requests/report'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        id: '{request[requestId]}'
        status: '{params[status]}'
  upload_artifact:
    params:
      artifact_path:
        type: string
      artifact_id:
        type: string
      node_name:
        type: string
      label:
        type: string
        default: Artifact
      content_type:
        type: string
        default: application/octet-stream
    actions:
    - type: inspect_file
      target: '{params[artifact_path]}'
      save_state: file_info
    - type: send_http_request
      url: '{session[server]}/api/requests/artifacts/upload-url'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        requestId: '{request[requestId]}'
        artifactId: '{params[artifact_id]}'
        sha256: '{actions[file_info][sha256]}'
        size: '{actions[file_info][size]}'
      save_state: upload
    - type: send_http_request
      url: '{actions[upload][body][uploadUrl]}'
      method: post
      header:
        Content-Type: '{params[content_type]}'
      body_file: '{actions[file_info][path]}'
      timeout: 120
      save_state: stored
    - type: send_http_request
      url: '{session[server]}/api/requests/artifacts/complete'
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        requestId: '{request[requestId]}'
        uploadId: '{actions[upload][body][uploadId]}'
        storageId: '{actions[stored][body][storageId]}'
        name: '{actions[file_info][name]}'
        nodeName: '{params[node_name]}'
        label: '{params[label]}'
      save_state: registered
    returns: '{actions[registered][body]}'
events:
- 'on': pipeline_started
  do:
  - type: execute_routine
    routine: report_request_status
    args:
      status: processing
- 'on': node_started
  do:
  - type: execute_routine
    routine: report_node_status
    args:
      status: running
      logs:
      - 'Started {event[node][name]}: {event[node][total_units]} units on {event[node][device][family]}:{event[node][device][index]}.'
- 'on': node_finished
  do:
  - type: execute_routine
    routine: report_node_status
    args:
      status: succeeded
      logs:
      - 'Finished {event[node][name]}: {event[node][status]}; skipped={event[node][skipped]};
        blocked={event[node][blocked]}; error={event[error]}.'
    precondition:
      operator: node_state
      target:
      - status
      expected: success
  - type: execute_routine
    routine: report_node_status
    args:
      status: failed
      logs:
      - 'Finished {event[node][name]}: {event[node][status]}; skipped={event[node][skipped]};
        blocked={event[node][blocked]}; error={event[error]}.'
    precondition:
      operator: node_state
      target:
      - status
      expected: failed
- 'on': pipeline_finished
  do:
  - type: execute_routine
    routine: report_request_status
    args:
      status: succeeded
    context:
      node:
        status: '{event[pipeline][status]}'
    precondition:
      operator: node_state
      target:
      - status
      expected: success
  - type: execute_routine
    routine: report_request_status
    args:
      status: process_failed
    context:
      node:
        status: '{event[pipeline][status]}'
    precondition:
      operator: node_state
      target:
      - status
      expected: failed
- 'on': pipeline_finished
  do:
  - type: execute_routine
    routine: send_notification
    args:
      title: Song pipeline completed
      message: Request {request[requestId]} for {params[name]} completed successfully
    context:
      node:
        status: '{event[pipeline][status]}'
    precondition:
      operator: node_state
      target:
      - status
      expected: success
