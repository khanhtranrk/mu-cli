version: 1.0

repair:
  # Download all required GGUF and safetensors files into {cache_dir}/models.
  - action: command
    steps:
      - [hf, download, Serveurperso/YuE2-GGUF, YuE2-Vae-F32.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, Serveurperso/YuE2-GGUF, YuE2-3B-Q8_0.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, Serveurperso/YuE2-GGUF, MERT-v2-FullSong-Q8_0.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, Serveurperso/YuE2-GGUF, SheetSage2-Q8_0.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, Serveurperso/YuE2-GGUF, yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, unsloth/Qwen-Image-2.1-GGUF, qwen-image-2.1-Q4_K_M.gguf, --local-dir, "{cache_dir}/models"]
      - [hf, download, unsloth/Qwen-Image-2.1-FP8, vae/qwen_image_2.1_vae_bf16.safetensors, --local-dir, "{cache_dir}/models"]
      - [hf, download, unsloth/Qwen3-VL-8B-Instruct-GGUF, Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf, --local-dir, "{cache_dir}/models"]
    validate:
      - condition: file-existed
        target: "{cache_dir}/models/YuE2-Vae-F32.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/YuE2-3B-Q8_0.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/MERT-v2-FullSong-Q8_0.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/SheetSage2-Q8_0.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/qwen-image-2.1-Q4_K_M.gguf"
      - condition: file-existed
        target: "{cache_dir}/models/vae/qwen_image_2.1_vae_bf16.safetensors"
      - condition: file-existed
        target: "{cache_dir}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf"

  - action: command
    steps:
      - [uv, tool, install, demucs, --with, wrapt, --with, numpy]
    validate:
      - condition: exit-zero
        target: [demucs, --help]

  - action: command
    steps:
      - [uv, tool, install, whisperx, --with, wrapt]
    validate:
      - condition: exit-zero
        target: [whisperx, --help]

  # These two programs are expected to be installed/built already.
  - action: command
    steps: []
    validate:
      - condition: file-existed
        target: "{cache_dir}/bin/yue-synth"
      - condition: exit-zero
        target: ["{cache_dir}/bin/yue-synth", --help]
      - condition: file-existed
        target: "{cache_dir}/bin/sd-cli"
      - condition: exit-zero
        target: ["{cache_dir}/bin/sd-cli", --help]

processors:
  yue2:
    target: "{cache_dir}/bin/yue-synth"
    params:
      - --model
      - "{models[YuE2-3B-Q8_0]}"
      - --vae
      - "{models[YuE2-Vae-F32]}"
      - --request
      - "{cache_dir}/requests/{request[name]}/{request[name]}.json"
      - --out
      - "{output_dir}/{request[name]}/{request[name]}.mp3"
      - --score
      - "{output_dir}/{request[name]}/{request[name]}.abc"
    units: 2

  sd-cli:
    target: "{cache_dir}/bin/sd-cli"
    params:
      - --diffusion-model
      - "{models[qwen-image-2.1-Q4_K_M]}"
      - --vae
      - "{models[vae/qwen_image_2.1_vae_bf16]}"
      - --llm
      - "{models[Qwen3-VL-8B-Instruct-UD-Q4_K_XL]}"
      - --flash-attn
      - off,diffusion=on
      - --prompt
      - "{request[cover_prompt]}"
      - --steps
      - "24"
      - --cfg-scale
      - "5.0"
      - --sampling-method
      - euler
      - -W
      - "{request[cover_with]}"
      - -H
      - "{request[cover_height]}"
      - -o
      - "{output_dir}/{request[name]}/cover.png"
    units: 6

  demucs:
    target: uvx
    params:
      - demucs
      - -n
      - htdemucs
      - --two-stems=vocals
      - --shifts
      - "1"
      - -j
      - "2"
      - -o
      - "{output_dir}/{request[name]}/separated"
      - "{output_dir}/{request[name]}/{request[name]}.mp3"
    device_args: ["-d", "cuda:{device_index}"]
    units: 1

  whisperx:
    target: uvx
    params:
      - whisperx
      - "{output_dir}/{request[name]}/separated/htdemucs/{request[name]}/vocals.wav"
      - --model
      - large-v3
      - --device
      - cuda
      - --batch_size
      - "4"
      - --output_dir
      - "{output_dir}/{request[name]}/transcript"
      - --output_format
      - all
    device_args: [--device_index, "{device_index}"]
    units: 3

pipelines:
  song-with-cover:
    steps:
      - name: generate-song
        processor: yue2
        output: "{output_dir}/{request[name]}/{request[name]}.mp3"
        score: "{output_dir}/{request[name]}/{request[name]}.abc"
        request: "{cache_dir}/requests/{request[name]}/{request[name]}.json"

      - name: generate-cover
        processor: sd-cli
        output: "{output_dir}/{request[name]}/cover.png"

      - name: separate-vocals
        processor: demucs
        input: "{output_dir}/{request[name]}/{request[name]}.mp3"
        output: "{output_dir}/{request[name]}/separated"
        waiting-for: [generate-song]

      - name: transcribe-vocals
        processor: whisperx
        input: "{output_dir}/{request[name]}/separated/htdemucs/{request[name]}/vocals.wav"
        output: "{output_dir}/{request[name]}/transcript"
        waiting-for: [separate-vocals]
