# MasterFlow media example: run actions generate files, upload them, then report node success.
# Existing files skip only generation; uploads are retried with stable request artifact IDs.
entries:
  direct_flow:
    initialization: []
  master_flow:
    initialization:
    - type: send_http_request
      url: "{session[server]}/api/notifications/send"
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        title: Worker ready
        message: Initialization completed
    finalization:
    - type: send_http_request
      url: "{session[server]}/api/notifications/send"
      method: post
      header:
        Authorization: Bearer {session[token]}
        Content-Type: application/json
      body:
        title: Worker ended
        message: Finalization completed
workloads:
  yue2:
    params:
      request:
        type: string
      output:
        type: string
      score:
        type: string
    target: "{sys[cache_dir]}/bin/yue-synth"
    args:
    - --model
    - "{sys[models][YuE2-3B-BF16]}"
    - --vae
    - "{sys[models][YuE2-Vae-F32]}"
    - --request
    - "{params[request]}"
    - --out
    - "{params[output]}"
    - --score
    - "{params[score]}"
    device_args:
    - --device
    - "{schedule[device_family]}{schedule[device_index]}"
    units: 3
  qwen-image:
    params:
      prompt:
        type: string
      cover_with:
        type: number
      cover_height:
        type: number
      output:
        type: string
    target: "{sys[cache_dir]}/bin/sd-cli"
    args:
    - --diffusion-model
    - "{sys[models][qwen-image-2.1-Q4_K_M]}"
    - --vae
    - "{sys[models][vae/qwen_image_2.1_vae_bf16]}"
    - --llm
    - "{sys[models][Qwen3-VL-8B-Instruct-UD-Q4_K_XL]}"
    - --flash-attn
    - off,diffusion=on
    - --prompt
    - "{params[prompt]}"
    - --steps
    - "24"
    - --cfg-scale
    - "5.0"
    - --sampling-method
    - euler
    - -W
    - "{params[cover_with]}"
    - -H
    - "{params[cover_height]}"
    - -o
    - "{params[output]}"
    device_args:
    - --backend
    - diffusion={schedule[device_family]}{schedule[device_index]},te={schedule[device_family]}{schedule[device_index]},vae={schedule[device_family]}{schedule[device_index]}
    units: 3
  demucs:
    params:
      input:
        type: string
      output:
        type: string
    target: uvx
    args:
    - demucs
    - -n
    - htdemucs
    - --two-stems=vocals
    - --shifts
    - "1"
    - -j
    - "2"
    - -o
    - "{params[output]}"
    - "{params[input]}"
    units: 1
    device_args:
    - -d
    - cuda:{schedule[device_index]}
  whisperx:
    params:
      input:
        type: string
      output:
        type: string
    target: uvx
    args:
    - whisperx
    - "{params[input]}"
    - --model
    - large-v3
    - --device
    - cuda
    - --batch_size
    - "4"
    - --output_dir
    - "{params[output]}"
    - --output_format
    - all
    units: 3
    device_args:
    - --device_index
    - "{schedule[device_index]}"
pipeline:
  song-with-cover:
    prepare:
    - type: execute_command
      save_state: prepare_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/YuE2-Vae-F32.gguf"
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - YuE2-Vae-F32.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: and
        props:
        - operator: file_exists
          path: "{sys[cache_dir]}/models/YuE2-Vae-F32.gguf"
        - operator: action_state
          target:
          - prepare_command
          - returncode
          expected: 0
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/YuE2-3B-BF16.gguf"
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - YuE2-3B-BF16.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/YuE2-3B-BF16.gguf"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf"
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - MERT-v2-FullSong-Q8_0.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf"
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - SheetSage2-Q8_0.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf"
      target: hf
      args:
      - download
      - Serveurperso/YuE2-GGUF
      - yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf"
      target: hf
      args:
      - download
      - unsloth/Qwen-Image-2.1-GGUF
      - qwen-image-2.1-Q4_K_M.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors"
      target: hf
      args:
      - download
      - unsloth/Qwen-Image-2.1-FP8
      - vae/qwen_image_2.1_vae_bf16.safetensors
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors"
    - type: execute_command
      skip_if:
        operator: file_exists
        path: "{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf"
      target: hf
      args:
      - download
      - unsloth/Qwen3-VL-8B-Instruct-GGUF
      - Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
      - --local-dir
      - "{sys[cache_dir]}/models"
      postcondition:
        operator: file_exists
        path: "{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf"
    - type: execute_command
      skip_if:
        operator: exit_code
        target:
        - demucs
        - --help
      target: uv
      args:
      - tool
      - install
      - demucs
      - --with
      - wrapt
      - --with
      - numpy
      postcondition:
        operator: exit_code
        target:
        - demucs
        - --help
    - type: execute_command
      skip_if:
        operator: exit_code
        target:
        - whisperx
        - --help
      target: uv
      args:
      - tool
      - install
      - whisperx
      - --with
      - wrapt
      postcondition:
        operator: exit_code
        target:
        - whisperx
        - --help
    params:
      name:
        type: string
      style:
        type: string
      lyrics:
        type: string
      cover_prompt:
        type: string
      cover_with:
        type: number
        default: 1280
      cover_height:
        type: number
        default: 768
    nodes:
    - name: generate-song
      postcondition:
        operator: and
        props:
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        - operator: exit_code
          expected: 1
          target:
          - '{sys[cache_dir]}/bin/yue-synth'
          - --help
      precondition:
        operator: exit_code
        expected: 1
        target:
        - '{sys[cache_dir]}/bin/yue-synth'
        - --help
      before_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            generate-song:
              status: running
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      - type: write_json
        path: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
        content:
          name: '{params[name]}'
          style: '{params[style]}'
          lyrics: '{params[lyrics]}'
      run:
      - type: execute_workload
        workload: yue2
        args:
          request: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
          output: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          score: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        skip_if:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
      - type: execute_command
        target: python
        args:
        - -c
        - import hashlib, sys; from pathlib import Path; p = Path(sys.argv[1]); print(hashlib.file_digest(p.open('rb'),
          'sha256').hexdigest(), end='')
        - '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        save_state: song_mp3_hash
      - type: execute_command
        target: python
        args:
        - -c
        - import os, sys; print(os.path.getsize(sys.argv[1]), end='')
        - '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        save_state: song_mp3_size
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/upload-url'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          artifactId: song-mp3
          sha256: '{actions[song_mp3_hash][stdout]}'
          size: '{actions[song_mp3_size][stdout]}'
        save_state: song_mp3_upload
      - type: send_http_request
        url: '{actions[song_mp3_upload][body][uploadUrl]}'
        method: post
        header:
          Content-Type: audio/mpeg
        body_file: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        timeout: 120
        save_state: song_mp3_stored
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/complete'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          uploadId: '{actions[song_mp3_upload][body][uploadId]}'
          storageId: '{actions[song_mp3_stored][body][storageId]}'
          name: '{params[name]}.mp3'
          nodeName: generate-song
          label: Song audio
      - type: execute_command
        target: python
        args:
        - -c
        - import hashlib, sys; from pathlib import Path; p = Path(sys.argv[1]); print(hashlib.file_digest(p.open('rb'),
          'sha256').hexdigest(), end='')
        - '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        save_state: song_abc_hash
      - type: execute_command
        target: python
        args:
        - -c
        - import os, sys; print(os.path.getsize(sys.argv[1]), end='')
        - '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        save_state: song_abc_size
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/upload-url'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          artifactId: song-abc
          sha256: '{actions[song_abc_hash][stdout]}'
          size: '{actions[song_abc_size][stdout]}'
        save_state: song_abc_upload
      - type: send_http_request
        url: '{actions[song_abc_upload][body][uploadUrl]}'
        method: post
        header:
          Content-Type: text/vnd.abc
        body_file: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        timeout: 120
        save_state: song_abc_stored
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/complete'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          uploadId: '{actions[song_abc_upload][body][uploadId]}'
          storageId: '{actions[song_abc_stored][body][storageId]}'
          name: '{params[name]}.abc'
          nodeName: generate-song
          label: ABC notation
      after_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            generate-song:
              status: succeeded
    - name: generate-cover
      precondition:
        operator: exit_code
        target:
        - '{sys[cache_dir]}/bin/sd-cli'
        - --help
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/cover.png'
      before_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            generate-cover:
              status: running
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      run:
      - type: execute_workload
        workload: qwen-image
        args:
          output: '{session[output_dir]}/{params[name]}/cover.png'
          prompt: '{params[cover_prompt]}'
          cover_with: '{params[cover_with]}'
          cover_height: '{params[cover_height]}'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/cover.png'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/cover.png'
      - type: execute_command
        target: python
        args:
        - -c
        - import hashlib, sys; from pathlib import Path; p = Path(sys.argv[1]); print(hashlib.file_digest(p.open('rb'),
          'sha256').hexdigest(), end='')
        - '{session[output_dir]}/{params[name]}/cover.png'
        save_state: cover_png_hash
      - type: execute_command
        target: python
        args:
        - -c
        - import os, sys; print(os.path.getsize(sys.argv[1]), end='')
        - '{session[output_dir]}/{params[name]}/cover.png'
        save_state: cover_png_size
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/upload-url'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          artifactId: cover-png
          sha256: '{actions[cover_png_hash][stdout]}'
          size: '{actions[cover_png_size][stdout]}'
        save_state: cover_png_upload
      - type: send_http_request
        url: '{actions[cover_png_upload][body][uploadUrl]}'
        method: post
        header:
          Content-Type: image/png
        body_file: '{session[output_dir]}/{params[name]}/cover.png'
        timeout: 120
        save_state: cover_png_stored
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/complete'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          uploadId: '{actions[cover_png_upload][body][uploadId]}'
          storageId: '{actions[cover_png_stored][body][storageId]}'
          name: cover.png
          nodeName: generate-cover
          label: Cover image
      after_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            generate-cover:
              status: succeeded
    - name: separate-vocals
      postcondition: &id001
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
      depends_on:
      - generate-song
      before_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            separate-vocals:
              status: running
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/separated'
      run:
      - type: execute_workload
        workload: demucs
        args:
          output: '{session[output_dir]}/{params[name]}/separated'
          input: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
        postcondition: *id001
      after_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            separate-vocals:
              status: succeeded
    - name: transcribe-vocals
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      depends_on:
      - separate-vocals
      before_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            transcribe-vocals:
              status: running
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/transcript'
      run:
      - type: execute_workload
        workload: whisperx
        args:
          output: '{session[output_dir]}/{params[name]}/transcript'
          input: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
        skip_if:
          operator: file_exists
          path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
        postcondition:
          operator: and
          props:
          - operator: file_exists
            path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      - type: execute_command
        target: python
        args:
        - -c
        - import hashlib, sys; from pathlib import Path; p = Path(sys.argv[1]); print(hashlib.file_digest(p.open('rb'),
          'sha256').hexdigest(), end='')
        - '{session[output_dir]}/{params[name]}/transcript/vocals.json'
        save_state: transcript_json_hash
      - type: execute_command
        target: python
        args:
        - -c
        - import os, sys; print(os.path.getsize(sys.argv[1]), end='')
        - '{session[output_dir]}/{params[name]}/transcript/vocals.json'
        save_state: transcript_json_size
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/upload-url'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          artifactId: transcript-json
          sha256: '{actions[transcript_json_hash][stdout]}'
          size: '{actions[transcript_json_size][stdout]}'
        save_state: transcript_json_upload
      - type: send_http_request
        url: '{actions[transcript_json_upload][body][uploadUrl]}'
        method: post
        header:
          Content-Type: application/json
        body_file: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
        timeout: 120
        save_state: transcript_json_stored
      - type: send_http_request
        url: '{session[server]}/api/requests/artifacts/complete'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          requestId: '{request[requestId]}'
          uploadId: '{actions[transcript_json_upload][body][uploadId]}'
          storageId: '{actions[transcript_json_stored][body][storageId]}'
          name: vocals.json
          nodeName: transcribe-vocals
          label: Vocal transcript
      after_run:
      - type: send_http_request
        url: '{session[server]}/api/requests/report'
        method: post
        header:
          Authorization: Bearer {session[token]}
          Content-Type: application/json
        body:
          id: '{request[requestId]}'
          node_states:
            transcribe-vocals:
              status: succeeded
