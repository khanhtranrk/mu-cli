master-flow:
  requests: []
prepare:
- type: execute_command
  save_state: prepare_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/YuE2-Vae-F32.gguf'
  target: hf
  args:
    - download
    - Serveurperso/YuE2-GGUF
    - YuE2-Vae-F32.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: and
    props:
    - operator: file_exists
      path: '{sys[cache_dir]}/models/YuE2-Vae-F32.gguf'
    - operator: action_state
      target: [prepare_command, returncode]
      expected: 0
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/YuE2-3B-BF16.gguf'
  target: hf
  args:
    - download
    - Serveurperso/YuE2-GGUF
    - YuE2-3B-BF16.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/YuE2-3B-BF16.gguf'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf'
  target: hf
  args:
    - download
    - Serveurperso/YuE2-GGUF
    - MERT-v2-FullSong-Q8_0.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/MERT-v2-FullSong-Q8_0.gguf'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf'
  target: hf
  args:
    - download
    - Serveurperso/YuE2-GGUF
    - SheetSage2-Q8_0.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/SheetSage2-Q8_0.gguf'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf'
  target: hf
  args:
    - download
    - Serveurperso/YuE2-GGUF
    - yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/yue2-mothersuperior-realaudio-tokenizer-v4-Q8_0.gguf'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf'
  target: hf
  args:
    - download
    - unsloth/Qwen-Image-2.1-GGUF
    - qwen-image-2.1-Q4_K_M.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/qwen-image-2.1-Q4_K_M.gguf'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors'
  target: hf
  args:
    - download
    - unsloth/Qwen-Image-2.1-FP8
    - vae/qwen_image_2.1_vae_bf16.safetensors
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/vae/qwen_image_2.1_vae_bf16.safetensors'
- type: execute_command
  skip_if:
    operator: file_exists
    path: '{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf'
  target: hf
  args:
    - download
    - unsloth/Qwen3-VL-8B-Instruct-GGUF
    - Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf
    - --local-dir
    - '{sys[cache_dir]}/models'
  postcondition:
    operator: file_exists
    path: '{sys[cache_dir]}/models/Qwen3-VL-8B-Instruct-UD-Q4_K_XL.gguf'
- type: execute_command
  skip_if:
    operator: exit_code
    target:
    - demucs
    - --help
  target: uv
  args:
  - tool
  - install
  - demucs
  - --with
  - wrapt
  - --with
  - numpy
  postcondition:
    operator: exit_code
    target:
    - demucs
    - --help
- type: execute_command
  skip_if:
    operator: exit_code
    target:
    - whisperx
    - --help
  target: uv
  args:
  - tool
  - install
  - whisperx
  - --with
  - wrapt
  postcondition:
    operator: exit_code
    target:
    - whisperx
    - --help
workloads:
  yue2:
    params:
      request:
        type: string
      output:
        type: string
      score:
        type: string
    target: '{sys[cache_dir]}/bin/yue-synth'
    args:
    - --model
    - '{sys[models][YuE2-3B-BF16]}'
    - --vae
    - '{sys[models][YuE2-Vae-F32]}'
    - --request
    - '{params[request]}'
    - --out
    - '{params[output]}'
    - --score
    - '{params[score]}'
    device_args:
    - --device
    - '{schedule[device_family]}{schedule[device_index]}'
    units: 3
  qwen-image:
    params:
      prompt:
        type: string
      cover_with:
        type: string
      cover_height:
        type: string
      output:
        type: string
    target: '{sys[cache_dir]}/bin/sd-cli'
    args:
    - --diffusion-model
    - '{sys[models][qwen-image-2.1-Q4_K_M]}'
    - --vae
    - '{sys[models][vae/qwen_image_2.1_vae_bf16]}'
    - --llm
    - '{sys[models][Qwen3-VL-8B-Instruct-UD-Q4_K_XL]}'
    - --flash-attn
    - off,diffusion=on
    - --prompt
    - '{params[prompt]}'
    - --steps
    - '24'
    - --cfg-scale
    - '5.0'
    - --sampling-method
    - euler
    - -W
    - '{params[cover_with]}'
    - -H
    - '{params[cover_height]}'
    - -o
    - '{params[output]}'
    device_args:
    - --backend
    - 'diffusion={schedule[device_family]}{schedule[device_index]},te={schedule[device_family]}{schedule[device_index]},vae={schedule[device_family]}{schedule[device_index]}'
    units: 3
  demucs:
    params:
      input:
        type: string
      output:
        type: string
    target: uvx
    args:
    - demucs
    - -n
    - htdemucs
    - --two-stems=vocals
    - --shifts
    - '1'
    - -j
    - '2'
    - -o
    - '{params[output]}'
    - '{params[input]}'
    units: 1
    device_args:
    - -d
    - cuda:{schedule[device_index]}
  whisperx:
    params:
      input:
        type: string
      output:
        type: string
    target: uvx
    args:
    - whisperx
    - '{params[input]}'
    - --model
    - large-v3
    - --device
    - cuda
    - --batch_size
    - '4'
    - --output_dir
    - '{params[output]}'
    - --output_format
    - all
    units: 3
    device_args:
    - --device_index
    - '{schedule[device_index]}'
pipeline:
  song-with-cover:
    params:
      name:
        type: string
      style:
        type: string
      lyrics:
        type: string
      cover_prompt:
        type: string
      cover_with:
        type: number
        default: 1280
      cover_height:
        type: number
        default: 768
    nodes:
    - name: generate-song
      skip_if:
        operator: and
        props:
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
      postcondition:
        operator: and
        props:
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
        - operator: file_exists
          path: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
        - operator: exit_code
          expected: 1
          target:
          - '{sys[cache_dir]}/bin/yue-synth'
          - --help
      precondition:
        operator: exit_code
        expected: 1
        target:
        - '{sys[cache_dir]}/bin/yue-synth'
        - --help
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      - type: write_json
        path: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
        content:
          name: '{params[name]}'
          style: '{params[style]}'
          lyrics: '{params[lyrics]}'
      run:
        workload: yue2
        args:
          request: '{session[cache_dir]}/requests/{params[name]}/{params[name]}.json'
          output: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
          score: '{session[output_dir]}/{params[name]}/{params[name]}.abc'
    - name: generate-cover
      precondition:
        operator: exit_code
        target:
        - '{sys[cache_dir]}/bin/sd-cli'
        - --help
      skip_if:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/cover.png'
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/cover.png'
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}'
      run:
        workload: qwen-image
        args:
          output: '{session[output_dir]}/{params[name]}/cover.png'
          prompt: '{params[cover_prompt]}'
          cover_with: '{params[cover_with]}'
          cover_height: '{params[cover_height]}'
    - name: separate-vocals
      skip_if:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
      depends_on:
      - node: generate-song
        condition:
          operator: node_status
          expected: success
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/separated'
      run:
        workload: demucs
        args:
          output: '{session[output_dir]}/{params[name]}/separated'
          input: '{session[output_dir]}/{params[name]}/{params[name]}.mp3'
    - name: transcribe-vocals
      skip_if:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      postcondition:
        operator: file_exists
        path: '{session[output_dir]}/{params[name]}/transcript/vocals.json'
      depends_on:
      - node: separate-vocals
        condition:
          operator: node_status
          expected: success
      before_run:
      - type: create_dir
        path: '{session[output_dir]}/{params[name]}/transcript'
      run:
        workload: whisperx
        args:
          output: '{session[output_dir]}/{params[name]}/transcript'
          input: '{session[output_dir]}/{params[name]}/separated/htdemucs/{params[name]}/vocals.wav'
